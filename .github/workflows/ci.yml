name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `build` is `tsc --noEmit` — the platform compiles the functions itself,
      # so this is purely a type gate.
      - run: npm run build
      - run: npm test

  sync-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYNC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync-service/package-lock.json
      # lib/ (imported by the service) resolves its deps from the root.
      - run: npm ci
      - run: npm ci
        working-directory: sync-service
      - name: Apply catalog v2 migrations
        run: for f in supabase/migrations/*.sql; do psql "$SYNC_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: npm run build
        working-directory: sync-service
      - run: npm test
        working-directory: sync-service

