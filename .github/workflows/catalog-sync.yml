name: catalog sync

# ─── The catalog scheduler ────────────────────────────────────────────────────
#
# This workflow *is* the scheduler for the catalog. It replaces the Firebase
# scheduled functions (`syncCatalogFull` / `syncCatalogDeltas`) that used to
# drive the sync from the app's repo: the schedule now ships with the service
# itself, runs on GitHub's cron, and needs no Firebase Blaze plan.
#
# Each run POSTs to the deployed service's `/api/sync/{full|deltas|stores}`
# endpoint once **per chain**, sequentially. Per-chain calls keep every
# invocation well inside the platform's function time limit, and a chain that
# fails no longer hides the others.
#
# GitHub cron is UTC-only while the chains publish on Israel time, so the times
# below are Israel *winter* time (UTC+2). During daylight saving (UTC+3) each
# run lands one hour later locally — harmless for a catalog refresh.
#
# Required repository secrets — Settings → Secrets and variables → Actions:
#   CATALOG_API_BASE   e.g. https://israeli-supermarkets-api.vercel.app  (no trailing slash)
#   SYNC_SECRET        the same value set as SYNC_SECRET on the deployment
#
# Failures are reported as GitHub issues (label `sync-failure`) by the last
# steps of each job — see scripts/report-sync-failures.ts. That uses this run's
# own GITHUB_TOKEN (hence `issues: write` below); no extra secret is needed.
#
# Note: GitHub disables scheduled workflows in a repository that has seen no
# activity for 60 days. Re-enable from the Actions tab if that ever happens.

on:
  schedule:
    # Branch directory sync — 02:30 Asia/Jerusalem (winter), ahead of the full
    # sync. One small file per chain, so it doesn't need its own time slot.
    - cron: '30 0 * * *'
    # Nightly full sync — 03:00 Asia/Jerusalem (winter).
    - cron: '0 1 * * *'
    # Intraday delta syncs — 07:00 / 11:00 / 15:00 / 19:00 Asia/Jerusalem.
    - cron: '0 5,9,13,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        type: choice
        options: [full, deltas, stores]
        default: full
      chain:
        description: 'Chain to sync'
        type: choice
        options: [all, osher_ad, rami_levy, yohananof, tiv_taam]
        default: all
      force:
        description: 'Re-download even if the source file is unchanged (full only)'
        type: boolean
        default: false

# A long full sync must never overlap the next scheduled run.
concurrency:
  group: catalog-sync
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the reporting step open/comment on `sync-failure` issues.
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One chain at a time: mirrors the previous sequential behaviour and keeps
      # the number of concurrent Atlas connections low on the free tier.
      max-parallel: 1
      fail-fast: false
      matrix:
        chain: [osher_ad, rami_levy, yohananof, tiv_taam]
    steps:
      - name: Sync ${{ matrix.chain }}
        id: sync
        if: >-
          ${{ github.event_name != 'workflow_dispatch'
              || inputs.chain == 'all'
              || inputs.chain == matrix.chain }}
        env:
          # workflow_dispatch → the chosen mode; scheduled → which cron fired
          # picks the mode (branch directory / full / intraday deltas).
          MODE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.mode
                || (github.event.schedule == '30 0 * * *' && 'stores'
                || (github.event.schedule == '0 1 * * *' && 'full' || 'deltas')) }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          CHAIN: ${{ matrix.chain }}
          API_BASE: ${{ secrets.CATALOG_API_BASE }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${API_BASE}" ] || [ -z "${SYNC_SECRET}" ]; then
            echo "::error::CATALOG_API_BASE and SYNC_SECRET must be set as repository secrets."
            exit 1
          fi

          url="${API_BASE%/}/api/sync/${MODE}?chain=${CHAIN}"
          if [ "${MODE}" = "full" ] && [ "${FORCE}" = "true" ]; then
            url="${url}&force=1"
          fi
          echo "POST /api/sync/${MODE}?chain=${CHAIN}"

          # Every attempt's response is kept in sync-attempts/ for the
          # reporting step. needs_report flips to true when an attempt fails or
          # a response lists failures (e.g. branch files skipped on an HTTP 200).
          mkdir -p sync-attempts
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "needs_report=false" >> "$GITHUB_OUTPUT"
          mark_report() { echo "needs_report=true" >> "$GITHUB_OUTPUT"; }

          # The sync endpoint runs to completion before responding, so the read
          # timeout is generous. Retry only transient failures (network drop,
          # 5xx); a 4xx means bad config and retrying cannot help.
          #
          # A delta sync stops starting files near the function's time limit
          # and reports the rest as `result.filesPending`; that's progress, not
          # a failure, so it's followed by another request (up to max_passes)
          # with a fresh retry budget. n numbers every request for the report.
          n=0
          pass=1
          max_passes=6
          attempt=1
          retried=false
          while [ "${attempt}" -le 3 ]; do
            n=$((n + 1))
            body="sync-attempts/attempt-${n}.json"
            started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            status=$(curl -sS -X POST \
              --max-time 600 \
              -H "x-sync-secret: ${SYNC_SECRET}" \
              -H "x-sync-issue-reporting: caller" \
              -D sync-attempts/headers.txt \
              -o "${body}" -w '%{http_code}' \
              "${url}") && curl_rc=0 || curl_rc=$?
            vercel_id=$(grep -i '^x-vercel-id:' sync-attempts/headers.txt 2>/dev/null | tail -1 | cut -d' ' -f2 | tr -d '\r')
            printf 'curl_rc=%s\nhttp_status=%s\nvercel_id=%s\nstarted_at=%s\n' \
              "${curl_rc}" "${status:-0}" "${vercel_id}" "${started_at}" > "sync-attempts/attempt-${n}.meta"

            if [ "${curl_rc}" -eq 0 ] && [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
              echo "${CHAIN}: ${MODE} sync ok (HTTP ${status})"
              head -c 2000 "${body}"; echo
              if jq -e '(.failures // []) | length > 0' "${body}" > /dev/null 2>&1; then
                echo "::warning::${CHAIN}: ${MODE} sync reported failures — see the issue reporting step."
                mark_report
              fi
              pending=$(jq -r '.result.filesPending // 0' "${body}" 2>/dev/null || echo 0)
              if [ "${pending}" -gt 0 ] 2>/dev/null; then
                if [ "${pass}" -lt "${max_passes}" ]; then
                  echo "${CHAIN}: ${pending} ${MODE} file(s) left after pass ${pass} — continuing."
                  pass=$((pass + 1))
                  attempt=1
                  continue
                fi
                echo "::warning::${CHAIN}: ${pending} ${MODE} file(s) still pending after ${max_passes} passes — the next run picks them up."
              fi
              [ "${retried}" = true ] && { echo "::warning::${CHAIN}: ${MODE} sync needed retries — see the issue reporting step."; mark_report; }
              exit 0
            fi

            mark_report
            if [ "${curl_rc}" -eq 0 ] && [ "${status}" -ge 400 ] && [ "${status}" -lt 500 ]; then
              echo "::error::${CHAIN}: ${MODE} sync rejected (HTTP ${status}) — check SYNC_SECRET / CATALOG_API_BASE."
              head -c 2000 "${body}"; echo
              exit 1
            fi

            echo "attempt ${attempt} failed (curl rc=${curl_rc}, HTTP ${status:-none})"
            [ -s "${body}" ] && { head -c 1000 "${body}"; echo; }
            retried=true
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done

          echo "::error::${CHAIN}: ${MODE} sync failed after 3 attempts."
          exit 1

      # ── Failure reporting ────────────────────────────────────────────────
      # Runs only when the step above flagged something to report, and can
      # never change the job's outcome (continue-on-error): the sync step's
      # own result stays the job's result even if GitHub is unreachable.
      - name: Check out reporter
        if: ${{ always() && steps.sync.outputs.needs_report == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Node
        if: ${{ always() && steps.sync.outputs.needs_report == 'true' }}
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Report failures as GitHub issues
        if: ${{ always() && steps.sync.outputs.needs_report == 'true' }}
        continue-on-error: true
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.sync.outputs.mode }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          CHAIN: ${{ matrix.chain }}
          ENDPOINT: /api/sync/${{ steps.sync.outputs.mode }}?chain=${{ matrix.chain }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB_NAME: sync (${{ matrix.chain }})
        run: |
          npm ci --no-audit --no-fund
          npx ts-node --transpile-only scripts/report-sync-failures.ts "${GITHUB_WORKSPACE}/sync-attempts"
