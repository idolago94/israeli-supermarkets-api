<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ניהול קטלוג — מחלקות מוצרים</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e5ea;
      --text: #1a1d23;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --ok: #059669;
      --chip: #eef2ff;
      --chip-text: #3730a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }
    header h1 { margin: 0 0 10px; font-size: 18px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .controls input[type="text"], .controls input[type="password"] {
      flex: 1 1 220px;
      min-width: 160px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
    }
    .controls input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    button {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    button.ghost:hover { background: var(--chip); }
    main { max-width: 960px; margin: 0 auto; padding: 16px 14px 60px; }
    .status { color: var(--muted); font-size: 14px; padding: 10px 2px; }
    .status.err { color: #b91c1c; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 2px; font-size: 15px; }
    .barcode { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip {
      background: var(--chip);
      color: var(--chip-text);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .chip b { font-weight: 700; }
    .prices { margin: 8px 0 4px; border-top: 1px dashed var(--border); padding-top: 8px; }
    .price-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      padding: 3px 0;
    }
    .price-row .chain { min-width: 90px; color: var(--muted); }
    .price-row .amount { font-weight: 700; }
    .price-row .sub { color: var(--muted); font-size: 12px; }
    .dept {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .dept label { font-size: 13px; font-weight: 600; }
    .dept input {
      flex: 1 1 180px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    .saved { color: var(--ok); font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .2s; }
    .saved.show { opacity: 1; }
    .hint { color: var(--muted); font-size: 13px; }
    #loadMore { display: block; margin: 8px auto 0; }
  </style>
</head>
<body>
  <header>
    <h1>ניהול קטלוג — מחלקות מוצרים</h1>
    <div class="controls">
      <input id="apiKey" type="password" placeholder="מפתח API (x-api-key)" autocomplete="off" />
      <input id="search" type="text" placeholder="חיפוש מוצר (שם) — או השאר ריק לעיון בכל הקטלוג" />
      <button id="reload">טען</button>
    </div>
  </header>

  <main>
    <div id="status" class="status"></div>
    <div id="list"></div>
    <button id="loadMore" class="ghost" style="display:none">טען עוד</button>
  </main>

  <script>
    (function () {
      var els = {
        apiKey: document.getElementById('apiKey'),
        search: document.getElementById('search'),
        reload: document.getElementById('reload'),
        status: document.getElementById('status'),
        list: document.getElementById('list'),
        loadMore: document.getElementById('loadMore'),
      };

      var state = { mode: 'browse', cursor: null, hasMore: false, loading: false };

      // ── API key persistence ──────────────────────────────────────────────
      els.apiKey.value = localStorage.getItem('catalogApiKey') || '';
      els.apiKey.addEventListener('change', function () {
        localStorage.setItem('catalogApiKey', els.apiKey.value.trim());
      });

      function key() { return els.apiKey.value.trim(); }

      function setStatus(msg, isErr) {
        els.status.textContent = msg || '';
        els.status.className = 'status' + (isErr ? ' err' : '');
      }

      async function api(path, opts) {
        opts = opts || {};
        var headers = { 'x-api-key': key() };
        if (opts.body) headers['content-type'] = 'application/json';
        var res = await fetch(path, { method: opts.method || 'GET', headers: headers, body: opts.body });
        if (res.status === 401) throw new Error('מפתח API שגוי או חסר (401)');
        if (!res.ok) throw new Error('שגיאת שרת ' + res.status);
        return res.json();
      }

      // ── Rendering ────────────────────────────────────────────────────────
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function chip(label, value) {
        var c = el('span', 'chip');
        var b = el('b', null, label + ': ');
        c.appendChild(b);
        c.appendChild(document.createTextNode(value));
        return c;
      }

      function fmtPrice(n) { return '₪' + Number(n).toFixed(2); }

      function measureChips(m) {
        var out = [];
        if (!m) return out;
        if (m.quantity != null) out.push(chip('כמות', String(m.quantity)));
        if (m.unitOfMeasure) out.push(chip('יח׳ מידה', m.unitOfMeasure));
        if (m.unitQty) out.push(chip('נמכר לפי', m.unitQty));
        if (m.qtyInPackage) out.push(chip('באריזה', m.qtyInPackage));
        if (m.isWeighted != null) out.push(chip('שקיל', m.isWeighted ? 'כן' : 'לא'));
        return out;
      }

      function card(p) {
        var c = el('div', 'card');
        c.appendChild(el('h2', null, p.name || '(ללא שם)'));
        c.appendChild(el('div', 'barcode', 'ברקוד: ' + p.id));

        var meta = el('div', 'meta');
        if (p.brand) meta.appendChild(chip('מותג', p.brand));
        if (p.unitQty) meta.appendChild(chip('גודל', p.unitQty));
        measureChips(p.measure).forEach(function (ch) { meta.appendChild(ch); });
        if (meta.childNodes.length) c.appendChild(meta);

        if (p.prices && p.prices.length) {
          var pr = el('div', 'prices');
          p.prices.forEach(function (price) {
            var row = el('div', 'price-row');
            row.appendChild(el('span', 'chain', price.chainName || price.chainId));
            row.appendChild(el('span', 'amount', fmtPrice(price.price)));
            var subs = [];
            if (price.unitOfMeasurePrice != null) subs.push(fmtPrice(price.unitOfMeasurePrice) + ' ליח׳ מידה');
            if (price.allowDiscount != null) subs.push(price.allowDiscount ? 'מותר הנחה' : 'ללא הנחה');
            if (price.updatedAt) subs.push('עודכן ' + new Date(price.updatedAt).toLocaleDateString('he-IL'));
            if (subs.length) row.appendChild(el('span', 'sub', '· ' + subs.join(' · ')));
            pr.appendChild(row);
          });
          c.appendChild(pr);
        }

        // Department editor
        var dept = el('div', 'dept');
        dept.appendChild(el('label', null, 'מחלקה:'));
        var input = el('input');
        input.type = 'text';
        input.placeholder = 'ללא מחלקה';
        input.value = p.department || '';
        dept.appendChild(input);
        var save = el('button', null, 'שמור');
        var saved = el('span', 'saved', '✓ נשמר');
        save.addEventListener('click', function () {
          saveDepartment(p, input, save, saved);
        });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') saveDepartment(p, input, save, saved);
        });
        dept.appendChild(save);
        dept.appendChild(saved);
        c.appendChild(dept);

        return c;
      }

      async function saveDepartment(p, input, save, saved) {
        var value = input.value.trim();
        save.disabled = true;
        saved.classList.remove('show');
        try {
          var data = await api('/api/products/' + encodeURIComponent(p.id), {
            method: 'PATCH',
            body: JSON.stringify({ department: value }),
          });
          p.department = (data.product && data.product.department) || '';
          input.value = p.department;
          saved.classList.add('show');
          setTimeout(function () { saved.classList.remove('show'); }, 1800);
        } catch (err) {
          setStatus('שמירת המחלקה נכשלה: ' + err.message, true);
        } finally {
          save.disabled = false;
        }
      }

      function appendProducts(items) {
        items.forEach(function (p) { els.list.appendChild(card(p)); });
      }

      // ── Data loading ─────────────────────────────────────────────────────
      async function loadBrowse(reset) {
        if (state.loading) return;
        if (reset) { els.list.innerHTML = ''; state.cursor = null; }
        state.loading = true;
        els.loadMore.disabled = true;
        setStatus('טוען מוצרים…');
        try {
          var q = '/api/products?limit=50' + (state.cursor ? '&cursor=' + encodeURIComponent(state.cursor) : '');
          var data = await api(q);
          appendProducts(data.products || []);
          state.cursor = data.cursor;
          state.hasMore = !!data.hasMore;
          els.loadMore.style.display = state.hasMore ? 'block' : 'none';
          setStatus(els.list.childNodes.length + ' מוצרים נטענו' + (state.hasMore ? ' (יש עוד)' : ''));
        } catch (err) {
          setStatus(err.message, true);
        } finally {
          state.loading = false;
          els.loadMore.disabled = false;
        }
      }

      async function loadSearch(term) {
        if (state.loading) return;
        state.loading = true;
        els.list.innerHTML = '';
        els.loadMore.style.display = 'none';
        setStatus('מחפש "' + term + '"…');
        try {
          var data = await api('/api/products/search?q=' + encodeURIComponent(term) + '&max=25');
          appendProducts(data.products || []);
          setStatus((data.products || []).length + ' תוצאות עבור "' + term + '"');
        } catch (err) {
          setStatus(err.message, true);
        } finally {
          state.loading = false;
        }
      }

      function run() {
        if (!key()) { setStatus('הזן מפתח API כדי לטעון את הקטלוג.', true); return; }
        var term = els.search.value.trim();
        if (term.length >= 2) { state.mode = 'search'; loadSearch(term); }
        else { state.mode = 'browse'; loadBrowse(true); }
      }

      // ── Events ───────────────────────────────────────────────────────────
      els.reload.addEventListener('click', run);
      els.search.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
      els.loadMore.addEventListener('click', function () { loadBrowse(false); });

      if (key()) run();
      else setStatus('הזן מפתח API כדי להתחיל.');
    })();
  </script>
</body>
</html>
